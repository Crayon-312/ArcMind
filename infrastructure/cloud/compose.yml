name: arcmind

x-logging: &default-logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m

services:
  edge:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      ARCMIND_PUBLIC_IP: ${ARCMIND_PUBLIC_IP:?set ARCMIND_PUBLIC_IP}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - edge
      - backend
    logging: *default-logging

  web:
    image: ghcr.io/crayon-312/arcmind-mobile-web:${ARCMIND_IMAGE_TAG:?set ARCMIND_IMAGE_TAG}
    restart: unless-stopped
    networks:
      - edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *default-logging

  api:
    image: ghcr.io/crayon-312/arcmind-cloud-server:${ARCMIND_IMAGE_TAG:?set ARCMIND_IMAGE_TAG}
    restart: unless-stopped
    environment:
      ARCMIND_LOGIN_USERNAME: ${ARCMIND_LOGIN_USERNAME:?set ARCMIND_LOGIN_USERNAME}
      ARCMIND_LOGIN_PASSWORD_HASH: ${ARCMIND_LOGIN_PASSWORD_HASH:?set ARCMIND_LOGIN_PASSWORD_HASH}
      ARCMIND_COOKIE_SECURE: "true"
      ARCMIND_DATABASE_URL: postgresql+psycopg://arcmind_runtime:${ARCMIND_RUNTIME_DATABASE_PASSWORD:?set ARCMIND_RUNTIME_DATABASE_PASSWORD}@postgres:5432/arcmind
      ARCMIND_DEEPSEEK_API_KEY: ${ARCMIND_DEEPSEEK_API_KEY:-}
      ARCMIND_DEEPSEEK_BASE_URL: ${ARCMIND_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ARCMIND_DEEPSEEK_MODEL: ${ARCMIND_DEEPSEEK_MODEL:-deepseek-v4-pro}
      ARCMIND_DEEPSEEK_TIMEOUT_SECONDS: ${ARCMIND_DEEPSEEK_TIMEOUT_SECONDS:-60}
      ARCMIND_DETERMINISTIC_CHUNK_DELAY_SECONDS: ${ARCMIND_DETERMINISTIC_CHUNK_DELAY_SECONDS:-0.15}
      ARCMIND_ENVIRONMENT: staging
      ARCMIND_PROOF_SECRET: ${ARCMIND_PROOF_SECRET:?set ARCMIND_PROOF_SECRET}
      ARCMIND_PUBLIC_ORIGIN: https://${ARCMIND_PUBLIC_IP:?set ARCMIND_PUBLIC_IP}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *default-logging

  worker:
    image: ghcr.io/crayon-312/arcmind-cloud-server:${ARCMIND_IMAGE_TAG:?set ARCMIND_IMAGE_TAG}
    restart: unless-stopped
    environment:
      ARCMIND_LOGIN_USERNAME: ${ARCMIND_LOGIN_USERNAME:?set ARCMIND_LOGIN_USERNAME}
      ARCMIND_LOGIN_PASSWORD_HASH: ${ARCMIND_LOGIN_PASSWORD_HASH:?set ARCMIND_LOGIN_PASSWORD_HASH}
      ARCMIND_DATABASE_URL: postgresql+psycopg://arcmind_runtime:${ARCMIND_RUNTIME_DATABASE_PASSWORD:?set ARCMIND_RUNTIME_DATABASE_PASSWORD}@postgres:5432/arcmind
      ARCMIND_DEEPSEEK_API_KEY: ${ARCMIND_DEEPSEEK_API_KEY:-}
      ARCMIND_DEEPSEEK_BASE_URL: ${ARCMIND_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ARCMIND_DEEPSEEK_MODEL: ${ARCMIND_DEEPSEEK_MODEL:-deepseek-v4-pro}
      ARCMIND_DEEPSEEK_TIMEOUT_SECONDS: ${ARCMIND_DEEPSEEK_TIMEOUT_SECONDS:-60}
      ARCMIND_DETERMINISTIC_CHUNK_DELAY_SECONDS: ${ARCMIND_DETERMINISTIC_CHUNK_DELAY_SECONDS:-0.15}
      ARCMIND_ENVIRONMENT: staging
      ARCMIND_PROOF_SECRET: ${ARCMIND_PROOF_SECRET:?set ARCMIND_PROOF_SECRET}
      ARCMIND_PUBLIC_ORIGIN: https://${ARCMIND_PUBLIC_IP:?set ARCMIND_PUBLIC_IP}
    command: ["python", "-m", "arcmind_cloud.worker"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from pathlib import Path; assert b'arcmind_cloud.worker' in Path('/proc/1/cmdline').read_bytes()
      interval: 10s
      timeout: 3s
      retries: 12
    logging: *default-logging

  migrate:
    image: ghcr.io/crayon-312/arcmind-cloud-server:${ARCMIND_IMAGE_TAG:?set ARCMIND_IMAGE_TAG}
    profiles: ["migration"]
    environment:
      ARCMIND_LOGIN_USERNAME: ${ARCMIND_LOGIN_USERNAME:?set ARCMIND_LOGIN_USERNAME}
      ARCMIND_LOGIN_PASSWORD_HASH: ${ARCMIND_LOGIN_PASSWORD_HASH:?set ARCMIND_LOGIN_PASSWORD_HASH}
      ARCMIND_DATABASE_URL: postgresql+psycopg://arcmind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/arcmind
      ARCMIND_PROOF_SECRET: ${ARCMIND_PROOF_SECRET:?set ARCMIND_PROOF_SECRET}
      ARCMIND_PUBLIC_ORIGIN: https://${ARCMIND_PUBLIC_IP:?set ARCMIND_PUBLIC_IP}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  queue-migrate:
    image: ghcr.io/crayon-312/arcmind-cloud-server:${ARCMIND_IMAGE_TAG:?set ARCMIND_IMAGE_TAG}
    profiles: ["migration"]
    environment:
      ARCMIND_LOGIN_USERNAME: ${ARCMIND_LOGIN_USERNAME:?set ARCMIND_LOGIN_USERNAME}
      ARCMIND_LOGIN_PASSWORD_HASH: ${ARCMIND_LOGIN_PASSWORD_HASH:?set ARCMIND_LOGIN_PASSWORD_HASH}
      ARCMIND_DATABASE_URL: postgresql+psycopg://arcmind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/arcmind
      ARCMIND_PROOF_SECRET: ${ARCMIND_PROOF_SECRET:?set ARCMIND_PROOF_SECRET}
      ARCMIND_PUBLIC_ORIGIN: https://${ARCMIND_PUBLIC_IP:?set ARCMIND_PUBLIC_IP}
    command: ["python", "-m", "arcmind_cloud.queue_schema"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  database-roles:
    image: ghcr.io/crayon-312/arcmind-cloud-server:${ARCMIND_IMAGE_TAG:?set ARCMIND_IMAGE_TAG}
    profiles: ["migration"]
    environment:
      ARCMIND_DATABASE_URL: postgresql+psycopg://arcmind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/arcmind
      ARCMIND_LOGIN_USERNAME: ${ARCMIND_LOGIN_USERNAME:?set ARCMIND_LOGIN_USERNAME}
      ARCMIND_LOGIN_PASSWORD_HASH: ${ARCMIND_LOGIN_PASSWORD_HASH:?set ARCMIND_LOGIN_PASSWORD_HASH}
      ARCMIND_PROOF_SECRET: ${ARCMIND_PROOF_SECRET:?set ARCMIND_PROOF_SECRET}
      ARCMIND_PUBLIC_ORIGIN: https://${ARCMIND_PUBLIC_IP:?set ARCMIND_PUBLIC_IP}
      ARCMIND_RUNTIME_DATABASE_PASSWORD: ${ARCMIND_RUNTIME_DATABASE_PASSWORD:?set ARCMIND_RUNTIME_DATABASE_PASSWORD}
    command: ["python", "-m", "arcmind_cloud.database_roles"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: arcmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: arcmind
      ARCMIND_RUNTIME_DATABASE_PASSWORD: ${ARCMIND_RUNTIME_DATABASE_PASSWORD:?set ARCMIND_RUNTIME_DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcmind -d arcmind"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *default-logging

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy-config:
  caddy-data:
  postgres-data:
