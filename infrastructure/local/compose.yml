name: arcmind-local

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: arcmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_USER: arcmind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcmind -d arcmind"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
