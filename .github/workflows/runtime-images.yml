name: Runtime images

on:
  push:
    branches: [v2]
    paths:
      - ".github/workflows/runtime-images.yml"
      - "apps/**"
      - "docs/contracts/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.10.9
          python-version: "3.12"
          enable-cache: true
      - working-directory: apps/cloud-server
        run: uv sync --frozen
      - working-directory: apps/cloud-server
        run: uv run ruff check . && uv run pyright && uv run pytest

  images:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: arcmind-cloud-server
            dockerfile: apps/cloud-server/Dockerfile
          - name: arcmind-mobile-web
            dockerfile: apps/mobile-web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/crayon-312/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/crayon-312/${{ matrix.name }}:v2
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
